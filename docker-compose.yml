services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: steam_dwh
      POSTGRES_USER: steam
      POSTGRES_PASSWORD: steam
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steam -d steam_dwh"]
      interval: 5s
      retries: 10

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: steam_dwh
      PG_USER: steam
      PG_PASSWORD: steam
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data

volumes:
  pgdata: